name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
          if-no-files-found: ignore

  stdlib-parse-audit:
    name: Pinned Crystal 1.21.0 stdlib parse audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download pinned Crystal 1.21.0 stdlib
        env:
          CRYSTAL_ARCHIVE_URL: https://github.com/crystal-lang/crystal/releases/download/1.21.0/crystal-1.21.0-1-linux-x86_64-bundled.tar.gz
          CRYSTAL_ARCHIVE_SHA256: cc407bd071915cc7b5d9348281e669a911d20a1f4b9fac52a62088660eb22208
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/crystal-1.21.0.tar.gz"
          curl -fsSL -o "$archive" "$CRYSTAL_ARCHIVE_URL"
          echo "$CRYSTAL_ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/crystal"
          tar -xzf "$archive" -C "$RUNNER_TEMP/crystal" --strip-components=2
          test -f "$RUNNER_TEMP/crystal/share/crystal/src/VERSION"
          echo "CRYSTAL_STDLIB_ROOT=$RUNNER_TEMP/crystal/share/crystal/src" >> "$GITHUB_ENV"

      - name: Indexed stdlib parse audit
        run: ./gradlew stdlibParseAudit -PcrystalCorpus=indexed -PcrystalStdlibRoot="$CRYSTAL_STDLIB_ROOT"

      - name: Distribution parse audit
        run: ./gradlew stdlibParseAudit -PcrystalCorpus=distribution -PcrystalStdlibRoot="$CRYSTAL_STDLIB_ROOT"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-parse-audit-reports
          path: |
            build/reports/stdlib-parse-audit/**
            build/test-results/stdlibParseAudit/**
          if-no-files-found: ignore
