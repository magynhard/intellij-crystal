<html><body>
Reports names that resolve to nothing in Crystal code: bare identifiers and call callees,
DOT method names with exact receivers, and constants.
<p>Example: <code>puts abc</code> reports <code>Cannot find 'abc'</code>.</p>
<p>Indexed-but-unrequired definitions, macro-uncertain types, and macro contexts stay silent.</p>
</body></html>
